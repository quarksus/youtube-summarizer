[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-tldw"
version = "1.1.0"
description = "Summarize a YouTube video from its captions, using Claude"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"   # anthropic 1.x requires 3.10+
authors = [{ name = "Jasmin Skenderi" }]
keywords = ["youtube", "summary", "transcript", "captions", "claude", "cli"]
dependencies = ["anthropic>=1.0", "yt-dlp"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/quarksus/youtube-summarizer"
Repository = "https://github.com/quarksus/youtube-summarizer"
Issues = "https://github.com/quarksus/youtube-summarizer/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build", "twine"]

[project.scripts]
# The distribution is yt-tldw, so that name works; ytsum stays as an alias
# because it is what the docs, the config directory and habit already use.
yt-tldw = "ytsum:main"
ytsum = "ytsum:main"

[tool.setuptools]
py-modules = ["ytsum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
