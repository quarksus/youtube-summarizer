[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ytsum"
version = "1.0.0"
description = "Summarize a YouTube video from its captions, using Claude"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["anthropic>=1.0", "yt-dlp"]

[project.scripts]
ytsum = "ytsum:main"

[tool.setuptools]
py-modules = ["ytsum"]
